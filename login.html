<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | SELLS HOUSE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <a href="index.html" class="back-link">← Volver al inicio</a>
                <div class="logo logo-login">
                    SELLS<span class="serif">HOUSE</span>
                </div>
                <h2 class="serif">Bienvenido de nuevo</h2>
                <p>Ingresa tus credenciales para acceder al portal.</p>
            </div>

            <form id="loginForm" class="login-form">
    <div class="search-field" id="nameField" style="display: none;">
        <label for="fullName">Nombre completo</label>
        <input type="text" id="fullName" placeholder="Tu nombre">
    </div>

    <div class="search-field">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="admin@sellhousebr.com" required>
    </div>

    <div class="search-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
    </div>

    <div class="login-options">
        <label class="remember-me">
            <input type="checkbox"> Recordarme
        </label>
        <a href="#" class="forgot-password" id="forgotPasswordLink">¿Olvidaste tu contraseña?</a>
    </div>

    <button type="submit" class="btn-search btn-login" id="submitBtn">Iniciar Sesión</button>
</form>

<p style="text-align:center; margin-top:1rem;">
    <a href="#" id="toggleMode">¿No tienes cuenta? Regístrate</a>
</p>

<div id="loginMessage" class="login-message" style="display: none;"></div>
            
            <div id="loginMessage" class="login-message" style="display: none;"></div>
        </div>
    </div>
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
</body>
</html>
