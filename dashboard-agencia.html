<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Agencia | SELLS HOUSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin:0; font-family:'Inter',sans-serif; background:#181410; color:#eee; }
        .topbar { padding:1rem 1.5rem; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; }
        .topbar a { color:#d4af37; text-decoration:none; }
        .logo { font-family:'Playfair Display',serif; font-weight:700; font-size:1.3rem; }
        .logo span { color:#d4af37; }
        main { max-width:700px; margin:0 auto; padding:1.5rem; }
        h2 { font-family:'Playfair Display',serif; }
        .field { margin-bottom:1rem; display:flex; flex-direction:column; gap:0.3rem; }
        .field label { color:#d4af37; font-size:0.9rem; }
        .field input, .field select {
            padding:0.7rem; border-radius:6px; border:1px solid #444;
            background:#222; color:#fff; font-size:1rem;
        }
        .btn { padding:0.8rem 1rem; border:none; border-radius:6px; background:#d4af37; color:#000; font-weight:600; cursor:pointer; width:100%; margin-top:0.5rem; }
        .btn.secondary { background:#555; color:#fff; }
        .btn.danger { background:#c0392b; color:#fff; }
        #formMessage { padding:0.8rem; border-radius:6px; margin-top:1rem; display:none; }
        .card { border:1px solid #333; border-radius:8px; padding:1rem; margin-bottom:1rem; }
        .card img { width:100%; max-height:180px; object-fit:cover; border-radius:6px; margin-bottom:0.5rem; }
        .card-actions { display:flex; gap:0.5rem; margin-top:0.5rem; }
        .card-actions .btn { width:auto; flex:1; padding:0.5rem; font-size:0.9rem; }
        .thumbs { display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:0.5rem; }
        .thumbs img { width:60px; height:60px; object-fit:cover; border-radius:4px; }
    </style>
</head>
<body>

    <div class="topbar">
    <div class="logo">SELLS<span>HOUSE</span></div>
    <div>
        <a href="dashboard-usuario.html" style="margin-right:1rem;">❤️ Mis favoritos</a>
        <a href="index.html">← Volver al inicio</a>
    </div>
</div>

    <main>
        <h2>Panel de Agencia</h2>

        <form id="propertyForm">
            <input type="hidden" id="propertyId">

            <div class="field">
                <label>Título</label>
                <input type="text" id="title" required>
            </div>

            <div class="field">
                <label>Operación</label>
                <select id="operation" required>
                    <option value="venta">Venta</option>
                    <option value="renta">Renta</option>
                </select>
            </div>

            <div class="field">
                <label>Precio (MXN)</label>
                <input type="number" id="price" required>
            </div>

            <div class="field">
                <label>Colonia</label>
                <input type="text" id="colonia">
            </div>

            <div class="field">
                <label>Ciudad</label>
                <input type="text" id="ciudad">
            </div>

            <div class="field">
                <label>Recámaras</label>
                <input type="number" id="bedrooms">
            </div>

            <div class="field">
                <label>Baños</label>
                <input type="number" id="bathrooms">
            </div>

            <div class="field">
                <label>m²</label>
                <input type="number" id="area_m2">
            </div>
            <div class="field">
    <label>Latitud (opcional)</label>
    <input type="number" step="any" id="latitude" placeholder="Ej: 19.4015">
</div>

<div class="field">
    <label>Longitud (opcional)</label>
    <input type="number" step="any" id="longitude" placeholder="Ej: -99.1710">
</div>

            <div class="field">
                <label>Estado</label>
                <select id="status">
                    <option value="disponible">Disponible</option>
                    <option value="reservada">Reservada</option>
                    <option value="vendida">Vendida</option>
                    <option value="rentada">Rentada</option>
                </select>
            </div>

            <div class="field">
                <label>Fotos (puedes elegir varias)</label>
                <input type="file" id="photos" accept="image/*" multiple>
            </div>

            <button type="submit" class="btn" id="submitBtn">Guardar propiedad</button>
            <button type="button" class="btn secondary" id="cancelEdit" style="display:none;">Cancelar edición</button>
        </form>

        <div id="formMessage"></div>

        <h2 style="margin-top:2.5rem;">Mis Propiedades</h2>
        <div id="propertiesGrid"><p>Cargando...</p></div>
        <h2 style="margin-top:2.5rem;">Consultas Recibidas</h2>
<div id="inquiriesList"><p>Cargando...</p></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/dashboard-agencia.js"></script>
</body>
</html>
