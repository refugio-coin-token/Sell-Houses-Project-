<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña | SELLS HOUSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin:0; font-family:'Inter',sans-serif; background:#181410; color:#eee; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .box { max-width:360px; width:100%; padding:1.5rem; }
        .logo { font-family:'Playfair Display',serif; font-weight:700; font-size:1.4rem; text-align:center; margin-bottom:1.5rem; }
        .logo span { color:#d4af37; }
        h2 { font-family:'Playfair Display',serif; text-align:center; }
        .field { margin-bottom:1rem; display:flex; flex-direction:column; gap:0.3rem; }
        .field label { color:#d4af37; font-size:0.9rem; }
        .field input {
            padding:0.7rem; border-radius:6px; border:1px solid #444;
            background:#222; color:#fff; font-size:1rem;
        }
        .btn { padding:0.8rem; border:none; border-radius:6px; background:#d4af37; color:#000; font-weight:600; cursor:pointer; width:100%; }
        #message { padding:0.8rem; border-radius:6px; margin-top:1rem; display:none; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">SELLS<span>HOUSE</span></div>
        <h2>Nueva contraseña</h2>
        <form id="resetForm">
            <div class="field">
                <label>Nueva contraseña</label>
                <input type="password" id="newPassword" minlength="6" required>
            </div>
            <button type="submit" class="btn">Guardar nueva contraseña</button>
        </form>
        <div id="message"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
