<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Propiedad | SELLS HOUSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin:0; font-family:'Manrope',sans-serif; background:#181410; color:#eee; }
        .topbar { padding:1rem 1.5rem; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; }
        .topbar a { color:#d4af37; text-decoration:none; }
        .logo { font-family:'Playfair Display',serif; font-weight:700; font-size:1.3rem; }
        .logo span { color:#d4af37; }
        main { max-width:800px; margin:0 auto; padding:1.5rem; }
        .gallery-main { width:100%; max-height:420px; object-fit:cover; border-radius:10px; }
        .gallery-thumbs { display:flex; gap:0.5rem; margin-top:0.6rem; overflow-x:auto; }
        .gallery-thumbs img { width:80px; height:80px; object-fit:cover; border-radius:6px; cursor:pointer; opacity:0.6; }
        .gallery-thumbs img.active { opacity:1; border:2px solid #d4af37; }
        h1 { font-family:'Playfair Display',serif; margin-bottom:0.2rem; }
        .price { color:#d4af37; font-size:1.6rem; font-weight:700; }
        .meta { display:flex; gap:1.2rem; margin:1rem 0; color:#ccc; }
        .section { margin-top:2rem; }
        .btn { padding:0.8rem 1.2rem; border:none; border-radius:6px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-block; text-align:center; }
        .btn-whatsapp { background:#25d366; color:#000; width:100%; margin-bottom:0.8rem; }
        .field { margin-bottom:1rem; display:flex; flex-direction:column; gap:0.3rem; }
        .field label { color:#d4af37; font-size:0.9rem; }
        .field input, .field textarea {
            padding:0.7rem; border-radius:6px; border:1px solid #444;
            background:#222; color:#fff; font-size:1rem; font-family:inherit;
        }
        .btn-submit { background:#d4af37; color:#000; width:100%; }
        #formMessage { padding:0.8rem; border-radius:6px; margin-top:1rem; display:none; }
        #map { height: 250px; border-radius:10px; margin-top:1rem; }
        .field-inline { display:flex; gap:0.8rem; }
.field-inline .field { flex:1; }
#mortgageResult { margin-top:1rem; padding:1rem; background:#222; border-radius:8px; }
#mortgageResult strong { color:#d4af37; font-size:1.3rem; }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

    <div class="topbar">
    <a href="index.html" class="logo" style="display:flex;align-items:center;gap:8px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:24px;height:24px;">
            <path d="M3 11.5L12 4l9 7.5" style="color:var(--gold-accent, #d4af37)"/>
            <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" style="color:#fff"/>
        </svg>
        SELLS<span>HOUSE</span>
    </a>
    <a href="index.html">← Volver al catálogo</a>
</div>

    <main id="content">
        <p>Cargando propiedad...</p>
    </main>
    <footer style="background:#000; color:#eee; padding:2.5rem 1.5rem 1.5rem; margin-top:3rem; font-family:'Manrope',sans-serif;">
    <div style="max-width:700px; margin:0 auto; display:flex; flex-direction:column; gap:1.2rem;">
        <div>
            <h3 style="font-family:'Playfair Display',serif; color:#d4af37; margin-bottom:0.6rem; font-size:1.2rem;">Contacto</h3>
            <p style="color:#aaa; margin-bottom:0.4rem;">📞 +52 56 4000 1010</p>
            <p style="color:#aaa; margin-bottom:0.4rem;">✉️ contacto@sellhousebr.com</p>
            <p style="color:#aaa;">📍 Av. Paseo de la Reforma, CDMX</p>
        </div>
    </div>
    <div style="text-align:center; color:#777; font-size:0.8rem; border-top:1px solid #333; margin-top:1.5rem; padding-top:1rem;">
        © 2026 SELLS HOUSE. Todos los derechos reservados.
    </div>
</footer>
 <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/propiedad.js"></script>
</body>
</html>
